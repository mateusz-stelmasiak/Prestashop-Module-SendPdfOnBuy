<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SimsGrab</title>
<link rel="icon" href="data:,">
<style>
@font-face { font-family: "Press Start 2P"; src: url("PressStart2P.ttf"); }
@font-face { font-family: "VT323"; src: url("VT323.ttf"); }
:root {
  --night: #12141c; --panel: #1d2030; --line: #2c3046; --ink: #ece8da; --muted: #7b8099;
  --green: #3ddc6f; --deep: #1a6b39; --red: #ff5a4e; --pink: #ff8fc7; --paper: #f8f6ee;
  --pix: "Press Start 2P", monospace; --vt: "VT323", monospace;
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--night); color: var(--ink); font: 20px/1.1 var(--vt); height: 100vh; overflow: hidden;
       display: grid; grid-template-rows: auto 1fr; user-select: none; }
button, input, select { font: inherit; color: inherit; border: 0; border-radius: 0; outline: none; }
button { cursor: pointer; }
#smoke { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; image-rendering: pixelated; z-index: 0; }

/* the one line */
header { position: relative; z-index: 1; display: flex; align-items: center; gap: 14px; padding: 16px 20px; }
.logo { font: 22px var(--pix); letter-spacing: 1px; text-shadow: 3px 3px 0 var(--deep); display: flex; gap: 12px; align-items: center; }
.logo i { width: 14px; height: 22px; background: var(--green); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
          animation: bob 1.2s steps(2) infinite; }
@keyframes bob { 50% { transform: translateY(-4px); } }
.line { flex: 1; display: flex; border: 3px solid var(--green); background: var(--panel); min-width: 0; }
.line input { flex: 1; min-width: 0; background: none; padding: 10px 14px; font-size: 26px; caret-color: var(--green); }
.line input::placeholder { color: var(--muted); }
.line select, .bar select { background: var(--night); font: 10px var(--pix); padding: 0 10px; border-left: 3px solid var(--green); }
.go { background: var(--green); color: var(--night); font: 14px var(--pix); padding: 0 22px; }
.go:hover, .go:focus-visible { background: var(--ink); }
.bar { display: flex; gap: 8px; align-items: center; font: 8px var(--pix); color: var(--muted); }
.bar select { border: 0; height: 34px; color: var(--ink); background: var(--panel); }
.bar button { background: var(--panel); height: 34px; padding: 0 10px; max-width: 180px; overflow: hidden;
              text-overflow: ellipsis; white-space: nowrap; font: 16px var(--vt); color: var(--ink); }
.bar button:hover { background: var(--line); }

/* results + agent browser */
main { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 380px; gap: 16px; padding: 0 20px 150px; min-height: 0; }
.results { position: relative; display: flex; flex-direction: column; min-height: 0; }
.tools { display: flex; gap: 8px; align-items: center; font: 9px var(--pix); color: var(--muted); padding-bottom: 10px; }
.tools .count { flex: 1; }
.tools button { background: var(--panel); padding: 9px 10px; font: 9px var(--pix); }
.tools button.big { background: var(--green); color: var(--night); }
.tools button:disabled { opacity: .4; cursor: default; }
.grid { flex: 1; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; align-content: start; padding-right: 4px; }
.card { position: relative; background: var(--panel); border: 3px solid var(--line); cursor: pointer; display: flex; flex-direction: column;
        animation: pop .25s steps(3) backwards; }
.card.on { border-color: var(--green); }
.card .img { aspect-ratio: 1; background: var(--line) center/cover; image-rendering: auto; }
.card .img.none { display: grid; place-items: center; font: 26px var(--pix); color: var(--muted); }
.card .t { padding: 6px 8px 2px; font-size: 18px; line-height: 1; height: 44px; overflow: hidden; }
.card .s { padding: 0 8px 8px; font: 7px var(--pix); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .me { position: absolute; top: 6px; left: 6px; font: 7px var(--pix); padding: 5px 6px; background: var(--pink); color: var(--night); }
.card .badge { position: absolute; top: 6px; right: 6px; font: 9px var(--pix); padding: 5px 6px; background: var(--night); }
.card.work .badge { color: var(--green); animation: blink .5s steps(1) infinite; }
.card.done .badge { background: var(--green); color: var(--night); }
.card.fail { opacity: .55; } .card.fail .badge { background: var(--red); color: var(--night); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
@keyframes blink { 50% { opacity: 0; } }
.empty { grid-column: 1/-1; margin-top: 12vh; text-align: center; font: 18px/2 var(--pix); color: var(--muted); }
.empty b { color: var(--green); font-weight: normal; }
::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: var(--line); }

.browser { display: flex; flex-direction: column; min-height: 0; border: 3px solid var(--line); background: var(--panel); }
.chrome { display: flex; gap: 6px; align-items: center; padding: 8px; background: var(--line); }
.chrome i { width: 9px; height: 9px; background: var(--muted); } .chrome i:first-child { background: var(--red); }
.chrome .url { flex: 1; background: var(--night); padding: 4px 8px; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page { position: relative; padding: 12px; flex: 0 0 auto; min-height: 210px; }
.page h3 { font: 9px/1.6 var(--pix); margin-bottom: 10px; color: var(--ink); height: 30px; overflow: hidden; }
.page ul { padding: 0; }
.page li { list-style: none; font-size: 18px; padding: 2px 6px 2px 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); position: relative; }
.page li.hot { color: var(--green); }
.page li.click { background: var(--green); color: var(--night); }
.page li.click::before { content: "▶"; position: absolute; left: 4px; font-size: 14px; }
#mouse { position: absolute; width: 16px; height: 22px; left: 300px; top: 160px; transition: left .45s steps(6), top .45s steps(6);
         background: var(--ink); clip-path: polygon(0 0, 0 80%, 28% 62%, 48% 100%, 64% 92%, 46% 56%, 80% 56%); pointer-events: none; }
.log { flex: 1; overflow: auto; border-top: 3px solid var(--line); padding: 8px 10px; font-size: 16px; line-height: 1.15; min-height: 0; }
.log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log b { display: inline-block; width: 96px; color: var(--muted); font-weight: normal; }
.log .ai b { color: var(--green); } .log .bad { color: var(--red); }

/* Plumbie + Pokémon-style dialog */
#plumbie { position: fixed; right: 12px; bottom: 6px; width: 230px; height: 270px; z-index: 3; image-rendering: pixelated; cursor: pointer;
           transform: translateY(110%); transition: transform .5s cubic-bezier(.3, 1.6, .5, 1); }
#plumbie.in { transform: none; }
.dialog { position: fixed; left: 20px; right: 250px; bottom: 16px; z-index: 2; background: var(--paper); color: #24263a;
          border: 4px solid #24263a; box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 6px #6c7393, 6px 6px 0 #0008;
          padding: 16px 22px; min-height: 108px; font-size: 30px; line-height: 1.05; display: none; }
.dialog.show { display: block; animation: pop .2s steps(3); }
.dialog .who { position: absolute; top: -18px; left: 16px; background: var(--pink); color: #24263a; font: 9px var(--pix);
               padding: 6px 10px; border: 3px solid #24263a; }
.dialog .more { position: absolute; right: 16px; bottom: 8px; font-size: 22px; animation: blink .6s steps(1) infinite; display: none; }
.dialog input { display: none; margin-top: 8px; width: 100%; background: #e6e2d4; color: #24263a; padding: 4px 10px; font-size: 28px; border: 3px solid #24263a; }
.choices { position: fixed; right: 250px; bottom: 150px; z-index: 2; background: var(--paper); color: #24263a; border: 4px solid #24263a;
           box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 6px #6c7393, 6px 6px 0 #0008; padding: 12px 18px 12px 12px; display: none; }
.choices.show { display: block; animation: pop .2s steps(3); }
.choices div { font-size: 28px; padding: 1px 0 1px 26px; position: relative; cursor: pointer; white-space: nowrap; }
.choices div.sel::before { content: "▶"; position: absolute; left: 2px; font-size: 22px; top: 4px; }

/* This or That */
.go.vs { background: var(--pink); padding: 0 16px; }
#vs { position: absolute; inset: 0; background: var(--night); display: none; flex-direction: column; gap: 14px; z-index: 1; }
#vs.on { display: flex; }
.vs-top { display: flex; align-items: center; gap: 10px; font: 10px var(--pix); color: var(--muted); }
.vs-top b { flex: 1; color: var(--green); font-weight: normal; }
.vs-top button { background: var(--green); color: var(--night); font: 9px var(--pix); padding: 9px 10px; }
.vs-top button.quit { background: var(--panel); color: var(--ink); }
.duel { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: stretch; }
.duel .vsx { align-self: center; font: 28px var(--pix); color: var(--pink); text-shadow: 3px 3px 0 #0008; animation: bob 1s steps(2) infinite; }
.pickc { display: flex; flex-direction: column; min-height: 0; max-height: 420px; background: var(--panel); border: 4px solid var(--line);
         cursor: pointer; transition: transform .15s steps(3), opacity .3s steps(4); animation: pop .25s steps(3); }
.pickc:hover { border-color: var(--green); transform: translateY(-4px); }
.pickc .img { flex: 1; min-height: 0; background: var(--line) center/cover; }
.pickc .t { padding: 8px 10px 0; font-size: 24px; height: 52px; overflow: hidden; }
.pickc .s { padding: 0 10px; font: 8px var(--pix); color: var(--muted); }
.pickc .key { padding: 8px 10px 10px; font: 9px var(--pix); color: var(--green); }
.pickc.win { border-color: var(--green); transform: scale(1.04); }
.pickc.lose { opacity: .15; transform: translateY(30px) rotate(-4deg); }
.meter { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; font: 7px var(--pix); color: var(--muted); }
.meter div { display: grid; grid-template-columns: 96px 1fr 96px; align-items: center; gap: 8px; }
.meter div span:last-child { text-align: right; }
.meter div.hot { color: var(--pink); }
.meter i { position: relative; height: 10px; background: var(--panel); }
.meter i::after { content: ""; position: absolute; top: -3px; width: 8px; height: 16px; background: var(--green);
                  left: calc(var(--v, .5) * 100% - 4px); transition: left .5s steps(6); }
.card .me.pct { background: var(--green); }
</style>
</head>
<body>
<canvas id="smoke"></canvas>

<header>
  <div class="logo"><i></i>SIMSGRAB</div>
  <form class="line" id="line">
    <input id="word" placeholder="one word: goth... or paste a pin / board" autocomplete="off" spellcheck="false">
    <select id="cat"></select>
    <button class="go">GO</button>
    <button type="button" class="go vs" id="vsgo" title="This or That: I learn your taste, then pick">VS</button>
  </form>
  <div class="bar">AI <select id="model"></select> MODS <button id="mods" title="Change Mods folder"></button>
    <button id="open" title="Open Mods folder">📂</button></div>
</header>

<main>
  <section class="results">
    <div class="tools"><span class="count" id="count">NO RESULTS YET</span>
      <button id="all">ALL</button><button id="none">NONE</button>
      <button class="big" id="dl" disabled>DOWNLOAD PACK ▶</button></div>
    <div class="grid" id="grid"><p class="empty">ONE WORD.<br><b>50 MODS.</b><br>ONE CLICK.</p></div>
    <div id="vs">
      <div class="vs-top"><span>THIS OR THAT</span><b id="round"></b><button class="quit" id="quit">QUIT</button><button id="enough">PICK FOR ME ▶</button></div>
      <div class="duel"><div class="pickc" id="pa"></div><div class="vsx">VS</div><div class="pickc" id="pb"></div></div>
      <div class="meter" id="meter"></div>
    </div>
  </section>
  <section class="browser">
    <div class="chrome"><i></i><i></i><i></i><div class="url" id="url">agent browser idle</div></div>
    <div class="page"><h3 id="ptitle">WAITING FOR A MISSION</h3><ul id="links"></ul><div id="mouse"></div></div>
    <div class="log" id="log"></div>
  </section>
</main>

<div class="choices" id="choices"></div>
<div class="dialog" id="dialog"><span class="who">PLUMBIE</span><span id="say"></span><input id="ask" spellcheck="false"><span class="more">▼</span></div>
<canvas id="plumbie" width="115" height="135" title="Talk to Plumbie"></canvas>

<script type="module">
import * as THREE from "./three.module.min.js";
const $ = (s) => document.querySelector(s);
const api = () => window.pywebview.api;
const state = { results: [], picked: new Set(), busy: false, packName: "" };

/* ---------- pixel smoke while busy ---------- */
const smoke = $("#smoke"), sx = smoke.getContext("2d"), puffs = [];
function smokeLoop() {
  const w = (smoke.width = innerWidth >> 2), h = (smoke.height = innerHeight >> 2);
  if (state.busy) for (let i = 0; i < 2; i++) puffs.push({ x: Math.random() * w, y: h, s: 2 + (Math.random() * 3 | 0), life: 1 });
  for (const p of puffs) {
    p.y -= 0.6; p.x += Math.sin(p.y / 9) * 0.5; p.life -= 0.006;
    const g = 20 + 110 * Math.max(p.life, 0);
    sx.fillStyle = `rgba(${g},${g},${g + 14},${Math.min(p.life * 1.4, .9)})`;
    sx.fillRect(p.x | 0, p.y | 0, p.s, p.s);
  }
  puffs.splice(0, puffs.length, ...puffs.filter((p) => p.life > 0 && p.y > -4));
  requestAnimationFrame(smokeLoop);
}
smokeLoop();

/* ---------- Plumbie, a little toon girl with a plumbob ---------- */
const cv = $("#plumbie"), renderer = new THREE.WebGLRenderer({ canvas: cv, alpha: true, antialias: false });
renderer.setSize(cv.width, cv.height, false);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(30, cv.width / cv.height, 0.1, 50);
camera.position.set(0, 1.45, 7.4); camera.lookAt(0, 1.3, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x554466, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(2, 4, 5); scene.add(sun);
const ramp = new THREE.DataTexture(new Uint8Array([90, 90, 90, 255, 180, 180, 180, 255, 255, 255, 255, 255]), 3, 1);
ramp.magFilter = ramp.minFilter = THREE.NearestFilter; ramp.needsUpdate = true;
const toon = (color, extra = {}) => new THREE.MeshToonMaterial({ color, gradientMap: ramp, ...extra });
const ball = (r, mat, x, y, z, sxyz = [1, 1, 1], parent) => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 14), mat);
  m.position.set(x, y, z); m.scale.set(...sxyz); (parent || girl).add(m); return m;
};
const girl = new THREE.Group(); scene.add(girl);
const skin = toon(0xffdcc8), hairM = toon(0x6b3fa0), dressM = toon(0xff8fc7), dark = toon(0x24263a);
const dress = new THREE.Mesh(new THREE.ConeGeometry(0.62, 1.05, 10), dressM); dress.position.y = 0.55; girl.add(dress);
ball(0.13, skin, -0.5, 0.75, 0.15); ball(0.13, skin, 0.5, 0.75, 0.15);           // hands
ball(0.14, dark, -0.2, 0.02, 0.1, [1, 0.6, 1.3]); ball(0.14, dark, 0.2, 0.02, 0.1, [1, 0.6, 1.3]); // shoes
const head = new THREE.Group(); head.position.y = 1.62; girl.add(head);
ball(0.66, skin, 0, 0, 0, [1, 0.94, 0.95], head);
ball(0.71, hairM, 0, 0.1, -0.08, [1.02, 0.9, 0.98], head);                      // hair shell (face cut by the skin ball)
const fringe = ball(0.6, hairM, 0, 0.32, 0.22, [1.05, 0.5, 0.75], head);
ball(0.27, hairM, -0.62, 0.42, -0.1, [1, 1, 1], head); ball(0.27, hairM, 0.62, 0.42, -0.1, [1, 1, 1], head); // buns
const eyes = [-0.24, 0.24].map((x) => {
  const e = ball(0.1, dark, x, -0.06, 0.6, [0.9, 1.35, 0.6], head);
  ball(0.035, toon(0xffffff), 0.03, 0.04, 0.08, [1, 1, 1], e); return e;
});
[-0.42, 0.42].forEach((x) => ball(0.09, toon(0xff6fa5, { transparent: true, opacity: 0.75 }), x, -0.22, 0.52, [1.3, 0.6, 0.4], head));
const mouth = ball(0.06, toon(0xc0395a), 0, -0.3, 0.6, [1.2, 0.5, 0.5], head);
const bob = new THREE.Mesh(new THREE.OctahedronGeometry(0.2, 0), toon(0x3ddc6f, { emissive: 0x1a6b39 }));
bob.scale.y = 1.7; scene.add(bob);
let talking = 0, cheer = 0, blink = 0;
renderer.setAnimationLoop((ms) => {
  const t = ms / 1000;
  girl.position.y = Math.sin(t * 2.4) * 0.07 + (cheer > 0 ? Math.abs(Math.sin(cheer * 9)) * 0.5 : 0);
  girl.rotation.y = Math.sin(t * 0.8) * 0.25 + (cheer > 0 ? (1 - cheer) * Math.PI * 2 : 0);
  head.rotation.z = Math.sin(t * 1.3) * 0.06 + (talking ? Math.sin(t * 14) * 0.04 : 0);
  mouth.scale.y = talking ? 0.4 + Math.abs(Math.sin(t * 16)) * 1.1 : 0.5;
  if ((blink -= 1 / 60) < -3 - Math.random()) blink = 0.12;
  eyes.forEach((e) => (e.scale.y = blink > 0 ? 0.15 : 1.35));
  bob.position.set(0, 2.85 + girl.position.y + Math.sin(t * 3) * 0.06, 0); bob.rotation.y = t * 1.8;
  cheer = Math.max(0, cheer - 1 / 70);
  renderer.render(scene, camera);
});
cv.onclick = () => !state.busy && menu();

/* ---------- Pokémon-style dialog: say(text, choices?, ask?) ---------- */
let queue = Promise.resolve(), passing = false;  // passing: a line nobody has to answer is being typed
function say(text, choices = [], ask = false, wait = true) {
  if (passing) talking = 0;  // a newer line cuts it short instead of queueing behind it
  const run = queue.then(() => new Promise((done) => {
    const d = $("#dialog"), box = $("#say"), more = d.querySelector(".more"), inp = $("#ask"), ch = $("#choices");
    cv.classList.add("in"); d.classList.add("show"); ch.classList.remove("show"); more.style.display = inp.style.display = "none";
    box.textContent = ""; talking = 1; passing = !wait && !ask && !choices.length; let i = 0;
    const finish = () => {
      talking = 0; passing = false; keys = null; box.textContent = text;
      if (ask) { inp.style.display = "block"; inp.value = ""; inp.focus(); inp.onkeydown = (e) => e.key === "Enter" && inp.value.trim() && (close(), done(inp.value.trim())); }
      else if (choices.length) pickFrom(choices, (k) => (close(), done(k)));
      else if (!wait) done();
      else { more.style.display = "block"; d.onclick = () => (close(), done()); keys = (e) => e.key === "Enter" && d.onclick(); }
    };
    const close = () => { d.onclick = null; keys = null; inp.onkeydown = null; ch.classList.remove("show"); };
    const type = () => (i < text.length && talking ? ((box.textContent = text.slice(0, ++i)), setTimeout(type, 22)) : finish());
    d.onclick = () => (i = text.length);
    keys = (e) => e.key === "Enter" && (i = text.length);  // Enter while typing: show it all at once
    type();
  }));
  queue = run.catch(() => {});
  return run;
}
let keys = null;
addEventListener("keydown", (e) => keys && keys(e));
function pickFrom(choices, done) {
  const ch = $("#choices"); let sel = 0;
  const draw = () => (ch.innerHTML = choices.map((c, k) => `<div class="${k === sel ? "sel" : ""}" data-k="${k}">${esc(c)}</div>`).join(""));
  draw(); ch.classList.add("show");
  ch.onclick = (e) => e.target.dataset.k && done(+e.target.dataset.k);
  ch.onmousemove = (e) => e.target.dataset.k && +e.target.dataset.k !== sel && ((sel = +e.target.dataset.k), draw());
  keys = (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { sel = (sel + (e.key === "ArrowDown" ? 1 : choices.length - 1)) % choices.length; draw(); e.preventDefault(); }
    if (e.key === "Enter") done(sel);
  };
}
const hush = () => { $("#dialog").classList.remove("show"); $("#choices").classList.remove("show"); };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

/* ---------- flows ---------- */
async function menu() {
  const k = await say("Hiii! I'm Plumbie, your mod buddy ✦ What are we hunting today?",
                      ["Mods by vibe", "This or That game", "Pinterest pin or board", "Tidy my Downloads", "Check & fix my Mods", "Game won't start?", "Just browsing"]);
  if (k === 0) return vibe();
  if (k === 1) return play(await say("Paste a pin to start from, or say one word!", [], true));
  if (k === 2) return go(await say("Paste a pin or a whole board right here!", [], true), "");
  if (k === 3) return tidy();
  if (k === 4) return checkMods();
  if (k === 5) return rescue();
  hush();
}
async function vibe() {
  const word = await say("Ooh! Give me ONE word. Like... goth!", [], true);
  const cats = state.categories;
  const k = await say(`${word.toUpperCase()}! Love it. What kind of mods?`, cats.map((c) => c.toUpperCase()));
  $("#word").value = word; $("#cat").value = cats[k];
  go(word, cats[k]);
}
async function go(word, cat) {
  if (state.busy || !word) return;
  if (game.on) quit();
  if (/pinterest\.|pin\.it\//.test(word)) return pinMode(word);
  if (/^(https?:\/\/|www\.)/.test(word)) return grabOne(word);
  busy(true); state.packName = `${word} ${cat}`.trim().replace(/\b\w/g, (c) => c.toUpperCase()); clearLog();
  say(`On it! Sending my agents out for ${word} ${cat}...`, [], false, false);
  try {
    state.results = await api().search(word, cat);
    state.picked = new Set(state.results.map((_, i) => i)); render(); busy(false);
    if (!state.results.length) return say("Hmm, the web came back empty. Try another word?");
    const k = await say(`Found ${state.results.length} ${word} ${cat} mods! Want the whole pack?`,
                        [`Download all ${state.results.length}`, "Let me pick", "Search again"]);
    if (k === 0) return download();
    if (k === 1) return say("Click cards to pick or unpick, then hit DOWNLOAD PACK!");
    vibe();
  } catch (e) { busy(false); say(`Aww, that didn't work: ${e.message || e}`); }
}
async function pinMode(url) {
  busy(true); clearLog(); $("#word").value = url;
  say("Ooh, a pin! Let me find all its twins...", [], false, false);
  try {
    const r = await api().similar(url);
    state.results = r.results; state.packName = r.name;
    state.picked = new Set(state.results.map((_, i) => i)); render(); busy(false);
    const me = state.results.findIndex((x) => x.this);
    const k = await say(`Found ${state.results.length} mods like this! Grab the whole ${r.name} pack?`,
                        [`Download all ${state.results.length}`, ...(me >= 0 ? ["Just this pin"] : []), "Let me pick"]);
    if (k === 0) return download();
    if (me >= 0 && k === 1) { state.picked = new Set([me]); render(); return download(); }
    say("Click cards to pick or unpick, then hit DOWNLOAD PACK!");
  } catch (e) { busy(false); say(`Aww: ${e.message || e}. Want to try another pin?`); }
}
async function download() {
  if (state.busy || !state.picked.size) return;
  const items = [...state.picked].map((i) => [i, state.results[i].url, state.results[i].title]);
  const name = state.packName || "Pack";
  busy(true); clearLog();
  say(`Downloading ${items.length} mods into your ${name} pack. Watch my agents click!`, [], false, false);
  try {
    const r = await api().download(items, name);
    busy(false); cheer = 1;
    const k = await say(`Yay! ${r.ok} of ${r.total} mods are in Mods/SimsGrab/${r.name}. A pack zip is in Downloads too!`,
                        ["Open Mods folder", "Find more", "Thanks Plumbie!"]);
    if (k === 0) api().open_mods(); else if (k === 1) vibe(); else hush();
  } catch (e) { busy(false); say(`Oh no: ${e.message || e}`); }
}
async function grabOne(url) {
  busy(true); clearLog(); say("Following the pin... hold my plumbob!", [], false, false);
  try { const r = await api().grab(url); busy(false); cheer = 1; await say(`Got it! ${r.name}, ${r.files} files installed in your Mods.`); hush(); }
  catch (e) { busy(false); say(`FAILED: ${e.message || e}. Some sites hide behind logins, sorry!`); }
}
const files = (n) => `${n} file${n === 1 ? "" : "s"}`;
const listed = (items) => items.slice(0, 3).map((i) => `${i.name} (${i.why})`).join(", ") + (items.length > 3 ? ` and ${items.length - 3} more` : "");

async function checkMods(found = null) {  // archives and buried script mods the game can't load, then a health check
  const r = found || (await api().check_mods()), a = r.archives.length, d = r.deep.length;
  if (a || d) {
    const what = [a && `${a} archive${a > 1 ? "s" : ""} the game can't open (${r.archives.slice(0, 3).join(", ")})`,
                  d && `${d} script mod${d > 1 ? "s" : ""} buried too deep`].filter(Boolean).join(" and ");
    if ((await say(`I peeked in your Mods folder: ${what}. Want me to fix it?`, ["Yes, fix it!", "Not now"])) !== 0) return hush();
    const f = await api().fix_mods();
    cheer = 1;
    await say(`Fixed! ${files(f.fixed)} can load now. The old archives are in Downloads/SimsGrab/from Mods.`
              + (f.failed.length ? ` I couldn't open ${f.failed.join(", ")}, sorry!` : ""));
  }
  if (found) return hush();
  const h = await api().doctor();
  await say(h.quarantined.length ? `I also moved ${files(h.quarantined.length)} that could break the game to SimsGrab Quarantine: ${listed(h.quarantined)}.`
                                 : a || d ? "Every mod file is healthy too ✦" : "Your Mods folder looks perfect! Nothing zipped, nothing broken ✦");
  hush();
}

async function rescue() {  // "the game won't start": check every file, then the 50/50 hunt if that wasn't it
  say("Oh no! Let me check every mod for damage...", [], false, false);
  const h = await api().doctor(), n = h.quarantined.length;
  const k = await say(n ? `Found ${files(n)} that can stop the game: ${listed(h.quarantined)}. They're in SimsGrab Quarantine now. Start the game: does it load?`
                        : "Every mod file looks healthy, so it's one the game just doesn't like. Want to find it with the 50/50 hunt? I move the files, you start the game.",
                      n ? ["Yes, it works!", "Still the error"] : ["Let's hunt!", "Not now"]);
  if (n && k === 0) { cheer = 1; await say("Yay! Happy simming ✦"); return hush(); }
  if (!n && k === 1) return hush();
  hunt5050(await api().bisect(null));
}

async function hunt5050(r) {  // each round: start the game and say if it loads; one bad mod gets cornered
  while (!r.done && !r.culprit) {
    const k = await say(`50/50 hunt: I moved ${r.out} of ${r.left} suspects out of Mods, about ${r.tries_left} more tr${r.tries_left === 1 ? "y" : "ies"}. Start the game now. Does it load?`,
                        ["Yes, it loads", "Still the error", "Stop, put everything back"]);
    r = await api().bisect(["works", "broken", "stop"][k]);
  }
  if (r.culprit) { cheer = 1; await say(`Found it! "${r.culprit}" was the troublemaker. It's in SimsGrab Quarantine and everything else is back. Start the game ✦`); }
  else await say("Okay! All your mods are back where they were.");
  hush();
}

async function tidy() {
  try { const n = await api().tidy(); cheer = n ? 1 : 0; await say(n ? `Done! Moved ${n} mod files into your Mods folder.` : "Your Downloads are already squeaky clean!"); hush(); }
  catch (e) { say(`Couldn't tidy: ${e.message || e}`); }
}

/* ---------- This or That: learn the player's taste from pairs, then pick by the average ---------- */
const AXES = [["DARK", "LIGHT"], ["MUTED", "COLORFUL"], ["COOL", "WARM"], ["SOFT", "CONTRASTY"], ["SIMPLE", "DETAILED"], ["MAXIS MATCH", "ALPHA"]];
const LINES = ["Ooh, tough one!", "Hmm hmm...", "Choose wisely ✦", "Cute pick!", "Next round!", "I'm learning you~"];
const game = { on: false, pool: [], picks: [], passes: [], seen: new Set(), round: 0, max: 10, axis: -1, pair: [], grown: 0 };
const loadImg = (src) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
const each = (list, fn, n) => { const q = [...list]; return Promise.all(Array.from({ length: n }, async () => { while (q.length) await fn(q.shift()); })); };
const taste = () => AXES.map((_, k) => (game.picks.length ? game.picks.reduce((a, c) => a + c.f[k], 0) / game.picks.length : 0.5));
const useAI = () => $("#model").value !== "no AI";
const brief = (c) => ({ title: c.title, site: c.site, q: c.f });  // what the chosen model gets to see of a mod
const dist = (a, b, skip = -1) => Math.sqrt(a.reduce((s, v, k) => (k === skip ? s : s + (v - b[k]) ** 2), 0));

async function look(card) {  // raw qualities of one mod: five from its picture, one from its title
  const t = `${card.title} ${card.url}`.toLowerCase();
  const alpha = /alpha|realis|\bhq\b|high.?quality/.test(t) ? 1 : /maxis.?match|\bmm\b/.test(t) ? 0 : 0.5;
  try {
    card.src = await api().image(card.image);
    const c = document.createElement("canvas"), x = c.getContext("2d", { willReadFrequently: true });
    c.width = c.height = 32; x.drawImage(await loadImg(card.src), 0, 0, 32, 32);
    const d = x.getImageData(0, 0, 32, 32).data, L = [];
    let sat = 0, warm = 0, w = 0, edge = 0;
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255, hi = Math.max(r, g, b), s = hi ? (hi - Math.min(r, g, b)) / hi : 0;
      L.push(0.299 * r + 0.587 * g + 0.114 * b); sat += s; warm += (s * (r - b + 1)) / 2; w += s;
    }
    const mean = L.reduce((a, v) => a + v) / L.length, sd = Math.sqrt(L.reduce((a, v) => a + (v - mean) ** 2, 0) / L.length);
    L.forEach((v, i) => i % 32 && (edge += Math.abs(v - L[i - 1])));
    card.raw = [mean, sat / L.length, w ? warm / w : 0.5, sd, edge / L.length, alpha];
  } catch { card.raw = null; }
}
function spread() {  // every quality becomes a 0..1 rank inside the pool, so "different" means different here
  const ok = game.pool.filter((c) => c.raw);
  AXES.forEach((_, k) => {
    const vals = ok.map((c) => c.raw[k]);
    ok.forEach((c) => {
      const below = vals.filter((v) => v < c.raw[k]).length, same = vals.filter((v) => v === c.raw[k]).length;
      (c.f ||= [])[k] = ok.length < 2 ? 0.5 : (below + (same - 1) / 2) / (ok.length - 1);
    });
  });
}
async function play(start) {
  if (state.busy || !start) return;
  busy(true); clearLog(); $("#word").value = start;
  Object.assign(game, { on: false, pool: [], picks: [], passes: [], seen: new Set(), round: 0, axis: -1, pair: [], grown: 0 });
  say("This or That! Gathering mods to show you...", [], false, false);
  try {
    const pin = /pinterest\.|pin\.it\//.test(start), cat = $("#cat").value;
    const r = pin ? await api().similar(start) : { name: `${start} ${cat}`, results: await api().search(start, cat) };
    state.packName = r.name.replace(/\b\w/g, (c) => c.toUpperCase());
    game.pool = r.results;
    say(`Looking closely at ${game.pool.length} mods... squint squint`, [], false, false);
    await each(game.pool, look, 8); spread(); busy(false);
    if (game.pool.filter((c) => c.f).length < 4) return say("Hmm, not enough pictures to play with. Try another pin or word?");
    const seed = game.pool.find((c) => c.this && c.f);
    if (seed) { game.picks.push(seed); game.seen.add(seed.url); }
    game.on = true; $("#vs").classList.add("on"); next();
  } catch (e) { busy(false); say(`Aww: ${e.message || e}`); }
}
async function next() {
  const left = game.pool.filter((c) => c.f && !game.seen.has(c.url));
  if (game.round >= game.max || left.length < 2) return finish();
  const m = taste(), range = (k) => Math.max(...left.map((c) => c.f[k])) - Math.min(...left.map((c) => c.f[k]));
  const axes = AXES.map((_, k) => k).filter((k) => range(k) > 0.2);
  const axis = (game.axis = axes.length ? axes[game.round % axes.length] : 0);
  let a = left.reduce((b, c) => (dist(c.f, m) < dist(b.f, m) ? c : b));           // closest to your taste so far
  const score = (c) => Math.abs(c.f[axis] - a.f[axis]) - 0.5 * dist(c.f, m, axis); // same vibe, opposite on one quality
  let b = left.filter((c) => c !== a).reduce((x, c) => (score(c) > score(x) ? c : x)), why = "";
  if (useAI()) {  // the chosen model picks the pair from a shortlist: nearest to the taste + most telling
    $("#round").textContent = "PLUMBIE IS THINKING..."; say("Hmm, let me think what to show you...", [], false, false);
    const byScore = [...left].sort((x, y) => score(y) - score(x)), near = [...left].sort((x, y) => dist(x.f, m) - dist(y.f, m));
    const cands = [...new Set([...near.slice(0, 8), ...byScore.slice(0, 6)])];
    const r = await api().next_pair(game.picks.map(brief), game.passes.map(brief), cands.map(brief)).catch(() => null);
    if (!game.on) return;
    if (r) [a, b, why] = [cands[r.a], cands[r.b], r.why];
  }
  game.pair = Math.random() < 0.5 ? [a, b] : [b, a];
  game.pair.forEach((c, k) => {
    const el = $(k ? "#pb" : "#pa"); el.className = "pickc";
    el.innerHTML = `<div class="img" style="background-image:url('${String(c.src).replace(/'/g, "%27")}')"></div>
      <div class="t">${esc(c.title)}</div><div class="s">${esc(c.site)}</div><div class="key">${k ? "THAT →" : "← THIS"}</div>`;
  });
  $("#round").textContent = `ROUND ${game.round + 1} / ${game.max}`; meter();
  say(why || (game.round ? `${LINES[game.round % LINES.length]} This round: ${AXES[axis][0]} or ${AXES[axis][1]}?`
                          : "Which one do you like more? Tap it, or use ← →!"), [], false, false);
}
function choose(k) {
  if (!game.on || !game.pair.length) return;
  const [win, lose] = k ? [game.pair[1], game.pair[0]] : game.pair;
  game.pair = []; game.picks.push(win); game.passes.push(lose); game.seen.add(win.url).add(lose.url); game.round++;
  $(k ? "#pb" : "#pa").classList.add("win"); $(k ? "#pa" : "#pb").classList.add("lose"); cheer = 0.3; meter();
  if (win.pin && game.grown < 4) grow(win.pin);
  setTimeout(next, 450);
}
async function grow(pin) {  // pull in pins like the one just picked
  game.grown++;
  const fresh = await api().related(pin);
  await each(fresh, look, 8);
  const known = new Set(game.pool.map((c) => c.url)), added = fresh.filter((c) => !known.has(c.url));
  game.pool.push(...added); spread();
  if (added.length) ui.on({ kind: "log", agent: "pinterest", msg: `+${added.length} pins like your pick` });
}
function meter() {
  if (!$("#meter").children.length) $("#meter").innerHTML = AXES.map(([lo, hi]) => `<div><span>${lo}</span><i></i><span>${hi}</span></div>`).join("");
  taste().forEach((v, k) => { const row = $("#meter").children[k]; row.querySelector("i").style.setProperty("--v", v); row.classList.toggle("hot", game.on && k === game.axis); });
}
async function finish() {
  game.on = false; $("#vs").classList.remove("on");
  const m = taste(), ranked = game.pool.filter((c) => c.f).sort((a, b) => dist(a.f, m) - dist(b.f, m));
  ranked.forEach((c) => (c.match = Math.round(100 * (1 - dist(c.f, m) / Math.sqrt(AXES.length)))));
  let order = ranked, n = Math.min(20, ranked.length);
  let words = AXES.map(([lo, hi], k) => (m[k] < 0.38 ? lo : m[k] > 0.62 ? hi : "")).filter(Boolean).join(", ");
  if (useAI() && ranked.length) {  // the chosen model makes the final pick from the 40 best by the math
    busy(true); say("Let me think really hard about your taste...", [], false, false);
    const cands = ranked.slice(0, 40);
    const r = await api().final_pick(game.picks.map(brief), game.passes.map(brief), cands.map(brief), n).catch(() => null);
    busy(false);
    if (r) {
      const chosen = r.order.map((i) => cands[i]);
      chosen.forEach((c) => (c.ai = true));
      order = [...chosen, ...ranked.filter((c) => !chosen.includes(c))]; n = chosen.length; words = r.taste || words;
    }
  }
  state.results = [...order, ...game.pool.filter((c) => !c.f)];
  state.picked = new Set([...state.results.keys()].slice(0, n));
  game.picks.forEach((c) => state.picked.add(state.results.indexOf(c)));
  render(); cheer = 1;
  const k = await say(`Your taste: ${words || "a little bit of everything"}! I picked your top ${state.picked.size}, best matches first.`,
                      [`Download my ${state.picked.size}`, "Let me pick", "Play again"]);
  if (k === 0) return download();
  if (k === 1) return say("Click cards to pick or unpick, then hit DOWNLOAD PACK!");
  play($("#word").value.trim());
}
function quit() { game.on = false; game.pair = []; $("#vs").classList.remove("on"); }
$("#pa").onclick = () => choose(0);
$("#pb").onclick = () => choose(1);
$("#enough").onclick = () => game.on && finish();
$("#quit").onclick = () => (quit(), hush());
$("#vsgo").onclick = () => { const w = $("#word").value.trim(); w ? play(w) : say("Type a word or paste a pin first, then hit VS!"); };
addEventListener("keydown", (e) => game.on && !$("#choices").classList.contains("show") && (e.key === "ArrowLeft" || e.key === "ArrowRight") && choose(e.key === "ArrowRight" ? 1 : 0));

/* ---------- page bits ---------- */
function busy(on) { state.busy = on; document.querySelectorAll(".go, #dl").forEach((b) => (b.disabled = on)); if (!on) updateCount(); }
function render() {
  $("#grid").innerHTML = state.results.map((r, i) => `
    <div class="card ${state.picked.has(i) ? "on" : ""}" data-i="${i}" style="animation-delay:${i * 25}ms" title="${esc(r.url)}">
      <div class="img ${r.image ? "" : "none"}" ${r.image ? `style="background-image:url('${esc(r.image).replace(/'/g, "%27")}')"` : ""}>${r.image ? "" : "?"}</div>
      ${r.match != null ? `<span class="me pct">${r.ai ? "★ " : ""}${r.match}% MATCH</span>` : r.this ? '<span class="me">THIS PIN</span>' : ""}<div class="t">${esc(r.title)}</div><div class="s">${esc(r.site)}</div><span class="badge">${state.picked.has(i) ? "✓" : ""}</span></div>`).join("");
  updateCount();
}
function updateCount() {
  $("#count").textContent = state.results.length ? `${state.results.length} RESULTS · ${state.picked.size} PICKED` : "NO RESULTS YET";
  $("#dl").disabled = state.busy || !state.picked.size;
  $("#dl").textContent = `DOWNLOAD PACK (${state.picked.size}) ▶`;
}
$("#grid").onclick = (e) => {
  const c = e.target.closest(".card"); if (!c || state.busy) return;
  const i = +c.dataset.i; state.picked.has(i) ? state.picked.delete(i) : state.picked.add(i);
  c.classList.toggle("on"); c.querySelector(".badge").textContent = state.picked.has(i) ? "✓" : ""; updateCount();
};
$("#all").onclick = () => !state.busy && ((state.picked = new Set(state.results.map((_, i) => i))), render());
$("#none").onclick = () => !state.busy && (state.picked.clear(), render());
$("#dl").onclick = download;
$("#line").onsubmit = (e) => { e.preventDefault(); go($("#word").value.trim(), $("#cat").value); };
$("#model").onchange = (e) => api().setting("model", e.target.value);
$("#mods").onclick = async () => setMods(await api().choose_mods());
$("#open").onclick = () => api().open_mods();
const setMods = (p) => { $("#mods").textContent = p.split(/[\\/]/).slice(-2).join("/"); $("#mods").title = p; };
const clearLog = () => ($("#log").innerHTML = "");

/* events pushed from Python: ui.on({kind, ...}) */
window.ui = { on(ev) {
  if (ev.kind === "log") {
    const row = document.createElement("div"); row.className = (ev.agent === "ai" ? "ai " : "") + (ev.msg.startsWith("x ") ? "bad" : "");
    row.innerHTML = `<b>${esc(ev.agent)}</b>${esc(ev.msg)}`; $("#log").append(row); $("#log").scrollTop = 1e9;
  } else if (ev.kind === "see") {
    $("#url").textContent = ev.url; $("#ptitle").textContent = ev.title || ev.url;
    $("#links").innerHTML = ev.links.map((l, k) => `<li class="${k === 0 ? "click" : l.hot ? "hot" : ""}">${esc(l.text || l.url)}</li>`).join("");
    const first = $("#links li"); if (first) Object.assign($("#mouse").style, { left: `${Math.min(first.offsetLeft + 160, 300)}px`, top: `${first.offsetTop + 10}px` });
  } else if (ev.kind === "item") {
    const c = $(`.card[data-i="${ev.i}"]`); if (!c) return;
    c.classList.remove("work", "done", "fail"); c.classList.add(ev.state);
    c.querySelector(".badge").textContent = { work: "...", done: "✓ IN", fail: "✗" }[ev.state];
  } else if (ev.kind === "chrome") {  // the Chrome extension handed over a pack
    cheer = 1;
    if (!state.busy && !game.on) say(`Ding! ${ev.files} file${ev.files === 1 ? "" : "s"} from "${ev.name}" just landed in your Mods ✦`, [], false, false);
  } else if (ev.kind === "quarantined") {  // the watcher caught broken mods before the game did
    say(`Heads up! I moved ${files(ev.items.length)} that would stop the game from starting to SimsGrab Quarantine: ${listed(ev.items)}.`, [], false, false);
  } else if (ev.kind === "modcheck" && !state.busy && !game.on) {
    checkMods(ev);
  } else if (ev.kind === "loose" && !state.busy) {
    say(`Psst! I spotted ${ev.count} mod${ev.count > 1 ? "s" : ""} lying in your Downloads (${ev.names.join(", ")}). Move them into Mods?`,
        ["Yes, tidy up!", "Not now"]).then((k) => (k === 0 ? tidy() : hush()));
  }
} };

async function start() {
  const h = await api().hello();
  state.categories = h.categories;
  $("#cat").innerHTML = h.categories.map((c) => `<option value="${c}">${c.toUpperCase()}</option>`).join("");
  $("#model").innerHTML = h.models.map((m) => `<option>${esc(m)}</option>`).join(""); $("#model").value = h.model;
  setMods(h.mods);
  setTimeout(async () => {
    cv.classList.add("in");
    if (!h.bisecting) return menu();
    await say("Welcome back! We're in the middle of the 50/50 hunt, let's finish it.");
    hunt5050(await api().bisect(null));
  }, 400);
}
window.pywebview?.api ? start() : addEventListener("pywebviewready", start);
</script>
