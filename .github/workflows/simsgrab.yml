name: SimsGrab exe

on:
  push:
    branches: ["**"]
    paths: ["SimsGrab/**", ".github/workflows/simsgrab.yml"]
    tags: ["simsgrab-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name SimsGrab SimsGrab/simsgrab.py
      - uses: actions/upload-artifact@v4
        with:
          name: SimsGrab
          path: dist/SimsGrab.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SimsGrab.exe
