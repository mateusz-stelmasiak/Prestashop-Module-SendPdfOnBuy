name: SimsGrab exe

on:
  push:
    branches: ["**"]
    paths: ["SimsGrab/**", ".github/workflows/simsgrab.yml"]
    tags: ["simsgrab-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pywebview
      - run: pyinstaller --onefile --windowed --name SimsGrab --add-data "SimsGrab/web;web" SimsGrab/simsgrab.py
      - uses: actions/upload-artifact@v4
        with:
          name: SimsGrab
          path: dist/SimsGrab.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'simsgrab-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'SimsGrab (latest build)' }}
          files: dist/SimsGrab.exe
